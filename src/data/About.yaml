title: Knowing Sam
paragraph:
    - index: 0
      content:
        valueGp: 
        - value: 
            text: "Holding a "
        - value: 
            text: "First Class Honours"
            style:
                color: 'rgb(226, 193, 131)'
        - value: 
            text: " degree in "
        - value:
            text: "Mechatronic Engineering "
            style:
                color: 'rgb(226, 193, 131)'
        - value:
            text: "and a "
        - value:
            text: "Master of Philosophy "
            style:
                color: 'rgb(226, 193, 131)'
        - value: 
            text: "degree with research focused on "
        - value:
            text: "diamagnetic levitation — specifically its extension and stability. "
            style:
                color: 'rgb(226, 193, 131)'
        - value:
            text: "My research highlighted the potential of diamagnetic levitation in enhancing micro- and      nano-scale force sensing technologies."

    - index : 1
      content:
        valueGp:
        - value: 
            text: "With over "
        - value:
            text: "12 years of experience "
            style:
                color: 'rgb(226, 193, 131)'
        - value:
            text: "as a "
        - value: 
            text: "Software Engineer "
            style:
                color: 'rgb(226, 193, 131)'
        - value: 
            text: "in the "
        - value:
            text: "semiconductor industry"
            style:
                color: 'rgb(226, 193, 131)'
        - value:
            text: ", I'm proud to have recently transitioned into the "
        - value:
            text: "medical device industry "
            style:
                color: 'rgb(226, 193, 131)'
        - value:
            text: "as a "
        - value:
            text: "Software Developer & Automation Engineer, "
            style:
                color: 'rgb(226, 193, 131)'
        - value:
            text: "applying my expertise to advance innovative technologies for the treatment of "
        - value:
            text: "atrial fibrillation (AF)."
            style:
                color: 'rgb(226, 193, 131)'

    - index: 2
      style:
        mb: '3em'
      list:
        subheader:
            text: "My core expertise includes:"
            style:
                mb: '0.5em'
        points:
        - point: "Automation solution - process studies and research"
        - point: "Semiconductor manufacturing robots - LED test & sort, wafer-embedded chip, LED surface mount bonding machines"
        - point: "Conducting motion cycle and control research"
        - point: "Optimizing robotic production cycles (up to 60,000 UPH)"
        - point: "Providing tailored production solutions and Industry 4.0 integration for clients"

    - index: 3
      subheader:
        text: "Samuel := INFINITY + 1"
        style:
            fontSize: "24px"
            textAlign: "center"
            color: 'rgb(226, 193, 131)'

    - index: 4
      content:
        style:
            mb: "0"
        valueGp:
        - value:
            text: "— I embrace a growth mindset, believing in the endless possibilities of learning from others and the world around me. With humility, I acknowledge my weaknesses, approach failures with optimism, and turn shortcomings into strengths to overcome future challenges. This mindset has driven me to continuously expand my expertise in "
        - value:
            text: "computer system technology, AI, robotics, and automation, "
            style:
                color: 'rgb(226, 193, 131)'
        - value: 
            text: "leveraging diverse programming languages, platforms, and software libraries to develop innovative engineering solutions."